appId: com.betteryou.app
---
# Flow 2: Golden Path - Workout Session & History
# 1. Launch app
- launchApp:
    clearState: false

# Handle onboarding tour if first launch
- runFlow:
    when:
      visible: "Get Started"
    commands:
      - tapOn: "Get Started"
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"

# 2. Navigate to Workouts tab using stable testID
- tapOn:
    id: "tab-workouts"
- assertVisible: "Workouts"

# 3. Start an empty workout session using stable testID
- tapOn:
    id: "workout-start-btn"

# 4. Verify Active Workout view is visible
- assertVisible: "Active Workout"
- assertVisible: "Add Exercise"

# 5. Add an exercise
- tapOn: "Add Exercise"
- runFlow:
    when:
      visible: "Barbell Bench Press"
    commands:
      - tapOn: "Barbell Bench Press"

# 6. Complete set 1 using stable testID
- runFlow:
    when:
      visible:
        id: "workout-complete-set-btn"
    commands:
      - tapOn:
          id: "workout-complete-set-btn"

# 7. Finish session using stable testID
- tapOn:
    id: "workout-finish-btn"
- runFlow:
    when:
      visible: "Finish"
    commands:
      - tapOn: "Finish"

# 8. Assert return to workouts history
- assertVisible: "Workouts"
- assertVisible: "PAST WORKOUTS"
