appId: com.betteryou.app
---
# Flow 3: Golden Path - Ingredient Lab Screening & Barcode
# 1. Launch app
- launchApp:
    clearState: false

# Handle onboarding tour if first launch
- runFlow:
    when:
      visible: "Get Started"
    commands:
      - tapOn: "Get Started"
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"

# 2. Navigate to Ingredient Lab / Screening tab using stable testID
- tapOn:
    id: "tab-toxicity-scan"
- assertVisible:
    id: "scan-mode-label-btn"
- assertVisible:
    id: "scan-mode-barcode-btn"

# 3. Switch to Barcode mode using stable testID
- tapOn:
    id: "scan-mode-barcode-btn"

# 4. Trigger manual product entry
- runFlow:
    when:
      visible:
        id: "scan-manual-type-btn"
    commands:
      - tapOn:
          id: "scan-manual-type-btn"
      - tapOn:
          id: "product-input-name"
      - inputText: "Organic Almond Milk"
      - tapOn:
          id: "product-analyze-btn"

# 5. Assert report view and close via stable testID
- runFlow:
    when:
      visible:
        id: "scan-report-close-btn"
    commands:
      - assertVisible:
          id: "scan-report-close-btn"
      - tapOn:
          id: "scan-report-close-btn"
