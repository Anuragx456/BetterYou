appId: com.betteryou.app
---
# Flow 1: Golden Path - Log Meal & Verify Dashboard
# 1. Launch app
- launchApp:
    clearState: false

# Handle onboarding tour if first launch
- runFlow:
    when:
      visible: "Get Started"
    commands:
      - tapOn: "Get Started"
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"

# 2. Navigate to Meal Vision tab using stable testID
- tapOn:
    id: "tab-meal-scan"

# 3. Enter meal via manual modal
- runFlow:
    when:
      visible:
        id: "meal-manual-btn"
    commands:
      - tapOn:
          id: "meal-manual-btn"

# 4. Fill in meal details in direct macros mode
- runFlow:
    when:
      visible:
        id: "meal-tab-direct"
    commands:
      - tapOn:
          id: "meal-tab-direct"
      - tapOn:
          id: "meal-input-name"
      - inputText: "Grilled Chicken & Rice"
      - tapOn:
          id: "meal-input-cals"
      - inputText: "650"
      - tapOn:
          id: "meal-save-preview-btn"

# 5. Verify macro verification card renders and save meal
- assertVisible:
    id: "meal-save-btn"
- tapOn:
    id: "meal-save-btn"

# 6. Return to Dashboard and assert updated calorie logs
- tapOn:
    id: "tab-dashboard"
- assertVisible: "Dashboard"
- assertVisible: "TODAY'S CALORIES"
