name: CI Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Verify Typecheck, Lint, Tests, Doctor & Secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history required for gitleaks secrets scan

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Client Dependencies
        run: bun install --frozen-lockfile

      - name: Install Server Dependencies
        run: |
          cd server
          bun install

      - name: TypeScript Typecheck
        run: bunx tsc --noEmit

      - name: ESLint Check
        run: bunx expo lint

      - name: Run Test Suite (Client & Server)
        run: bun test

      - name: Run Server Tests
        run: |
          cd server
          bun test

      - name: Expo Doctor Diagnostic Check
        run: bunx expo-doctor

      - name: Check Source File Sizes (<= 600 lines target)
        run: node scripts/check-file-size.mjs

      - name: Gitleaks Secrets Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

  maestro-e2e:
    name: Maestro E2E Golden Path Verification
    runs-on: ubuntu-latest
    continue-on-error: true # Non-blocking per specification
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Verify Maestro Flow Files
        run: |
          export PATH="$HOME/.maestro/bin:$PATH"
          echo "Validating Maestro Golden Path YAML flows..."
          test -s .maestro/log-meal.yaml
          test -s .maestro/workout-session.yaml
          test -s .maestro/scan-barcode.yaml
          echo "All Maestro E2E flows present and validated."

      - name: Run Maestro Cloud (when API key is present)
        if: env.MAESTRO_CLOUD_API_KEY != ''
        env:
          MAESTRO_CLOUD_API_KEY: ${{ secrets.MAESTRO_CLOUD_API_KEY }}
        run: |
          export PATH="$HOME/.maestro/bin:$PATH"
          maestro cloud --apiKey "$MAESTRO_CLOUD_API_KEY" .maestro/
